# Local / single-node stack for the real-time chat app.
#
#   docker compose -f deployments/docker-compose.yml up --build
#
# Services
#   postgres  - message, user and webhook persistence (published on 5433 to
#               match the DATABASE_URL in the repo's .env)
#   redpanda  - Kafka-compatible bus; internal listener on 9092, published on
#               19092 for host-side tools (rpk)
#   api       - REST + WebSocket + SSE; runs migrations on start
#   worker    - Kafka consumer that signs and dispatches webhooks
#
# Set JWT_SECRET before starting (compose refuses to start without it):
#   export JWT_SECRET=$(openssl rand -hex 32)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      # Internal listener for the app containers (redpanda:9092) ...
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
      # ... and one for host-side tools (localhost:19092).
      - --kafka-addr
      - external://0.0.0.0:19092
      - --advertise-kafka-addr
      - external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: chat.events
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      TOKEN_TTL: ${TOKEN_TTL:-24h}
      INSTANCE_ID: ${INSTANCE_ID:-api-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MIGRATE_ON_START: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: chat.events
      # Only the api migrates, so the two do not race on the schema.
      MIGRATE_ON_START: "false"
      # true lets a receiver on the compose network (or the host, via the
      # published ports) be registered; keep false for anything public.
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}

volumes:
  pgdata:
